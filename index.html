<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa Propiedades BNI V2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;display:flex;height:100vh;background:#f4f6f5}
#sidebar{width:320px;background:#fff;padding:20px;overflow:auto;box-shadow:0 0 20px rgba(0,0,0,.15)}
#map{flex:1}
.logo{width:220px;display:block;margin:0 auto 15px}
.hero{background:linear-gradient(135deg,#0c3b2e,#145c48);color:#fff;padding:16px;border-radius:12px;margin-bottom:15px}
.card{background:#fff;border:1px solid #eee;border-radius:12px;padding:12px;margin-bottom:12px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#145c48;color:#fff;font-weight:bold}
#contador{font-size:28px;font-weight:bold;color:#145c48}
label{display:block;margin:6px 0}
.cardimg{width:100%;max-height:220px;object-fit:cover;border-radius:8px}
.leaflet-popup-content{width:340px !important}
.whatsapp{position:fixed;bottom:20px;right:20px;background:#25d366;color:white;text-decoration:none;padding:14px 18px;border-radius:30px;font-weight:bold;z-index:9999}

.legend-box{position:fixed;bottom:80px;left:20px;background:white;padding:10px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,.15);z-index:999}
#menuToggle{
position:fixed;
bottom:220px;
right:20px;
z-index:3000;
background:#145c48;
color:white;
border:none;
padding:12px 16px;
border-radius:10px;
font-weight:bold;
display:none;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}
@media(max-width:768px){
 #menuToggle{display:block;}
}

}


.floating-legend{
position:fixed;
right:20px;
bottom:85px;
background:white;
padding:10px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
z-index:1200;
line-height:1.6;
}
@media(max-width:768px){
 .floating-legend{
   right:10px;
   bottom:90px;
 }
}
.buscar-movil{display:none;}
@media(max-width:768px){
 .buscar-movil{
   display:block !important;
   width:100%;
   padding:14px;
   margin-top:12px;
   border:none;
   border-radius:10px;
   background:#145c48;
   color:white;
   font-weight:bold;
 }
 body.menu-open .floating-legend{
position:fixed;
right:20px;
bottom:85px;
background:white;
padding:10px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
z-index:1200;
line-height:1.6;
}
@media(max-width:768px){
 .floating-legend{
   right:10px;
   bottom:90px;
 }
}
}


@media(max-width:768px){
 #sidebar{
   position:fixed!important;
   left:0;
   top:0;
   width:320px;
   height:100vh;
   z-index:1500;
   background:#fff;
   overflow:auto;
   transition:left .3s;
 }
 #sidebar.closed{left:-340px!important;}
 body.menu-open .floating-legend{display:none!important;}
}
.floating-legend{
position:fixed!important;
right:20px!important;
bottom:90px!important;
left:auto!important;
z-index:9998!important;
background:white;
padding:10px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}
</style>
</head>

<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vR_mpwpqH_Bnkca8oImRuKOUhRSNlxf00mZ3TPM6K693Q_7hPOX9uXR5PMzJMBPW1ZXCfkBKgtXTR0A/pub?output=csv";

const map=L.map('map').setView([31.69,-106.42],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let markers=[];

function colorPorTipo(tipo){
 if(tipo==="Terreno") return "green";
 if(tipo==="Local") return "blue";
 if(tipo==="Bodega") return "orange";
 if(tipo==="Casa") return "violet";
 return "red";
}

function cargar(){
 markers.forEach(m=>map.removeLayer(m));
 markers=[];

 Papa.parse(CSV_URL,{
  download:true,
  header:true,
  complete:function(res){

   let agrupadas={};

   res.data.forEach(r=>{
     const id=r["Id de propiedad"];
     if(!id) return;

     if(!agrupadas[id]){
       agrupadas[id]={...r};
     }else{
       if((r["Precio de venta"]||"").trim()!=="") agrupadas[id]["Precio de venta"]=r["Precio de venta"];
       if((r["Precio de renta"]||"").trim()!=="") agrupadas[id]["Precio de renta"]=r["Precio de renta"];
     }
   });

   const tipos=[...document.querySelectorAll(".tipo:checked")].map(x=>x.value);
   const verVenta=document.getElementById("venta").checked;
   const verRenta=document.getElementById("renta").checked;
const texto=(document.getElementById("busqueda")?.value||"").toLowerCase();

   Object.values(agrupadas).forEach(p=>{

     if(!tipos.includes(p["Tipo"])) return;

const searchable=((p["Titulo"]||"")+" "+(p["Direccion"]||"")+" "+(p["Id de propiedad"]||"")+" "+(p["Tipo"]||"")).toLowerCase();
if(texto && !searchable.includes(texto)) return;

     const tieneVenta=(p["Precio de venta"]||"").trim()!=="";
     const tieneRenta=(p["Precio de renta"]||"").trim()!=="";

     if(!verVenta && !verRenta) return;
     if(verVenta && !verRenta && !tieneVenta) return;
     if(verRenta && !verVenta && !tieneRenta) return;
     if(verVenta && verRenta && !tieneVenta && !tieneRenta) return;

     const lat=parseFloat(p["Latitud"]);
     const lon=parseFloat(p["Longitud"]);
     if(isNaN(lat)||isNaN(lon)) return;

     const icon=L.divIcon({
       html:`<div style="background:${colorPorTipo(p["Tipo"])};width:16px;height:16px;border-radius:50%;border:2px solid white"></div>`,
       className:"",
       iconSize:[16,16]
     });

     let popup='';

     if(p["image"]){
       popup+=`<img class="cardimg" src="${p["image"]}">`;
     }

     popup+=`<h3>${p["Titulo"]||""}</h3>`;
     popup+=`<b>🏷 ${p["Tipo"]||""}</b><br>`;
     popup+=`<b>📍</b> ${p["Direccion"]||""}<br><br>`;

     if(p["Precio de venta"]){
       popup+=`<b>💰 Venta:</b><br>${p["Precio de venta"]}<br><br>`;
     }

     if(p["Precio de renta"]){
       popup+=`<b>💵 Renta:</b><br>${p["Precio de renta"]}<br><br>`;
     }

     popup+=`<b>👤</b> ${p["Agente"]||""}<br>`;
     popup+=`<b>📞</b> ${p["Telefono"]||""}<br><br>`;
     popup+=`<a href="${p["URL"]}" target="_blank">🔗 Ver ficha completa</a>`;

     const m=L.marker([lat,lon],{icon:icon}).addTo(map).bindPopup(popup);
     markers.push(m);
document.getElementById('contador').innerText=markers.length;
   });
  }
 });
}

cargar();
</script>

<script>
document.addEventListener('DOMContentLoaded',function(){
  const side=document.getElementById('sidebar');
  const btn=document.getElementById('buscarMovil');

  function esMovil(){ return window.innerWidth<=768; }

  if(esMovil() && side){
     side.classList.add('open');
  }

  if(btn && side){
     btn.addEventListener('click',function(){
        if(typeof cargar==='function'){ cargar(); }
        if(esMovil()){ side.classList.remove('open'); }
     });
  }
});
</script>

<script>
document.addEventListener('DOMContentLoaded',()=>{
  const sidebar=document.getElementById('sidebar');
  const buscar=document.getElementById('buscarMovil');

  function syncMenu(){
    if(window.innerWidth<=768){
      if(sidebar && sidebar.classList.contains('open')){
        document.body.classList.add('menu-open');
      }else{
        document.body.classList.remove('menu-open');
      }
    }
  }

  if(buscar){
    buscar.style.display='block';
    buscar.style.width='100%';
    buscar.style.marginTop='10px';
  }

  syncMenu();

  if(buscar && sidebar){
    buscar.addEventListener('click',()=>{
      sidebar.classList.remove('open');
      syncMenu();
    });
  }

  const obs=new MutationObserver(syncMenu);
  if(sidebar) obs.observe(sidebar,{attributes:true,attributeFilter:['class']});
});
</script>

<script>
document.addEventListener('DOMContentLoaded',function(){
  const buscar=document.getElementById('buscarMovil');
  const sidebar=document.getElementById('sidebar');

  function ocultarMenu(){
    if(window.innerWidth<=768 && sidebar){
      sidebar.classList.remove('open');
      document.body.classList.remove('menu-open');
    }
  }

  if(buscar){
    buscar.onclick=function(){
      if(typeof cargar==='function'){ cargar(); }
      ocultarMenu();
    };
  }
});
</script>


<script>
document.addEventListener('DOMContentLoaded',function(){
 const side=document.getElementById('sidebar');
 const buscar=document.getElementById('buscarMovil');
 const menu=document.getElementById('menuToggle');
 function sync(){
   if(window.innerWidth<=768){
      if(side.classList.contains('closed')){
         document.body.classList.remove('menu-open');
      }else{
         document.body.classList.add('menu-open');
      }
   }
 }
 if(window.innerWidth<=768){ side.classList.remove('closed'); sync(); }
 if(buscar){
   buscar.addEventListener('click',function(){
      side.classList.add('closed');
      sync();
   },true);
 }
 if(menu){
   menu.addEventListener('click',function(){
      side.classList.toggle('closed');
      sync();
   },true);
 }
});
</script>
